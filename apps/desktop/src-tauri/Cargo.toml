[package]
name = "excaildraw-desktop"
version.workspace = true
edition.workspace = true
description = "excaildraw desktop shell (Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[lib]
name = "excaildraw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "excaildraw-desktop"
path = "src/main.rs"

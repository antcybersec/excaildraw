<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>excaildraw</title>
    <link data-trunk rel="rust" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
      .app { display: flex; flex-direction: column; height: 100%; }
      .toolbar {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 12px; background: #1e1e1e; color: #fff;
        border-bottom: 1px solid #333;
      }
      .brand { font-weight: 700; margin-right: 12px; letter-spacing: -0.02em; }
      .tool-btn {
        background: #2d2d2d; color: #fff; border: 1px solid #444;
        border-radius: 6px; padding: 6px 12px; cursor: pointer;
      }
      .tool-btn:hover { background: #3d3d3d; }
      .tool-btn.active { background: #6965db; border-color: #6965db; }
      .hint { margin-left: auto; opacity: 0.6; font-size: 12px; }
      .canvas { flex: 1; width: 100%; cursor: crosshair; display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>

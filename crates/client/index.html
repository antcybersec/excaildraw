<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>excaildraw</title>
    <link data-trunk rel="rust" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
      .app { display: flex; flex-direction: column; height: 100%; }
      .toolbar {
        display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        padding: 8px 12px; background: #1e1e1e; color: #fff;
        border-bottom: 1px solid #333;
      }
      .brand { font-weight: 700; margin-right: 8px; }
      .tool-group { display: flex; gap: 4px; padding-right: 8px; border-right: 1px solid #444; }
      .tool-btn {
        background: #2d2d2d; color: #fff; border: 1px solid #444;
        border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px;
      }
      .tool-btn:hover { background: #3d3d3d; }
      .tool-btn.active { background: #6965db; border-color: #6965db; }
      .tool-btn.primary { background: #2f9e44; border-color: #2f9e44; }
      .room-pass {
        background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 6px;
        padding: 6px 8px; width: 120px;
      }
      .status { font-size: 12px; opacity: 0.8; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
      .hint { margin-left: auto; opacity: 0.5; font-size: 11px; }
      .main { flex: 1; display: flex; min-height: 0; }
      .layers {
        width: 220px; background: #fff; border-right: 1px solid #dee2e6;
        overflow-y: auto; padding: 8px;
      }
      .layers-head { font-weight: 600; margin-bottom: 8px; color: #495057; }
      .layer-row {
        display: flex; gap: 4px; align-items: center; margin-bottom: 4px;
        padding: 4px; border-radius: 4px;
      }
      .layer-row.active { background: #e7f5ff; }
      .layer-name { flex: 1; text-align: left; border: none; background: transparent; cursor: pointer; font-size: 12px; }
      .layer-btn { width: 24px; border: 1px solid #ced4da; background: #f8f9fa; border-radius: 4px; cursor: pointer; }
      .canvas { flex: 1; width: 100%; cursor: crosshair; display: block; }
      .hidden-input { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
